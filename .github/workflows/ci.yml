name: App CI
# A PR runs once (pull_request); main runs again after the merge (push). Pushing to a branch
# with an open PR used to run everything twice.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: docker build -t darupoyo-back:test .
  integration:
    # The browser tests run one at a time (they share one backend), so they are split across
    # four machines that run side by side: about 11 minutes became about 3.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: npm ci
      - run: npm run setup:backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080/api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-failure-${{ matrix.shard }}
          path: test-results/
